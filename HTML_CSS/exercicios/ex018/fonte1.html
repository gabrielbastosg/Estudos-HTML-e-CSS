<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Fontes</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=Unica+One&display=swap');
h1{ 
    font-family: 'Lavishly Yours', cursive;
    font-size:40px ;
    color: brown;
    font-size: 2em;
}
h2 {
        font-family: 'Story Script', cursive;
        color: blue;
        font-size: 2em;
}

p {
    font-family: 'Unica One', sans-serif;
    color: rgb(48, 78, 3);
    font-size: 1.4em;
}
</style>
</head>
<body>
    <h1>Testando os tipos de fontes que existem</h1>
    <p>Eu vou escrevendo qualquer coisa para ocupar espaco e ir testando o tipos de fontes</p>
    <h2>Outro tipo de fonte</h2>
    <p>E Aqui fiz a mesma coisa,outro paragrafo com palavras aleatorias</p>
</body>
</html>
