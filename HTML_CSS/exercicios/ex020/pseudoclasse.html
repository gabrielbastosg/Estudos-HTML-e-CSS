<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div{
            background-color: aliceblue;
            text-align: center;
            border:1px solid black;
            height: 200px;
            width: 200px;
        }
        div:hover{
            background-color: rgb(46, 46, 95);
        }

    </style>
</head>
<body>

    <div id="d1">Ola</div>
    <div id="d2">Oi</div>
    <div id="d3">Boa tarde</div>
</body>
</html>
