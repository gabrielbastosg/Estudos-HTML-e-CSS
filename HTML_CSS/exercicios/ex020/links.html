<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }
        a {
            color: rgb(10, 179, 170);
        }
        a:visited {
            color: rgb(17, 0, 112);
        }
        a:hover{
            color: rgb(43, 43, 255);
            text-decoration: underline;
        }
        a:active {
            color: greenyellow;
        }
        a::after{
            content: ' [link]';
            color: rgb(0, 98, 245);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/gabrielbastosg?tab=repositories" target="_blank">Link do Github</a></li>
        <li><a href="https://www.youtube.com/watch?v=yDD_3Nl9X_k" target="_blank">Link do Youtube</a></li>
        <li><a href="https://www.w3schools.com/css/default.asp" target="_blank">Link Aleatorio</a></li>
    </ul>
</body>
</html>
