<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>

        div > p {
            display: none;
        }

        div:hover > p{
            display: block;
            color: rgb(22, 255, 255);
            background-color: rgba(137, 43, 226, 0.582);
            width: 300px;
        }

        div:hover {
            color: blueviolet;
        }

    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o Mouse sobre o texto que esta abaixo</p>
    <div>
        Passe o Mouse aqui
        <p>TEXTO ESCONDIDO.....</p>
    </div>
    <p>FIM DO EXEMPLO</p>
</body>
</html>
